version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taito-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taito
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  frontend:
    build: ./frontend
    container_name: taito-frontend
    ports:
      - "8080:80"
    restart: always

    backend:
    build: ./backend
    container_name: taito-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data: