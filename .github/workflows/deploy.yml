name: Deploy to Azure VM

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Clone repo if missing, otherwise navigate into it
            if [ ! -d "taito" ]; then
              git clone https://github.com/lilyblossm3-cloud/taito.git
            fi
            
            cd taito
            
            # Fetch latest branches and switch to release
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # Disable BuildKit and deploy containers
            export DOCKER_BUILDKIT=0
            docker compose down
            docker compose up --build -d